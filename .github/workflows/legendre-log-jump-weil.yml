name: Legendre Logarithmic Jump Sector Weil Arb

on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/legendre_log_jump_weil_arb.py'
      - '.github/workflows/legendre-log-jump-weil.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-mean-zero-completed-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install outward FLINT Arb arithmetic
        run: python -m pip install 'python-flint==0.9.0'
      - name: Certify log-Legendre odd and even-meanzero completed Weil lower bounds
        run: python discovery/legendre_log_jump_weil_arb.py
