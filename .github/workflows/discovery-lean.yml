name: Discovery Lean quick checks

on:
  push:
    branches:
      - codex/discovery-workbench
    paths:
      - "DiscoveryLean/**"
      - "lakefile.toml"
      - "lean-toolchain"
      - ".github/workflows/discovery-lean.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/discovery-workbench
      - name: Install Lean 4.33.1
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve mathlib
        run: |
          lake update
          lake exe cache get
      - name: Confirm Lean 4.33.1
        run: |
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.33.1"
          lean --version
      - name: Build discovery sandbox
        run: lake build DiscoveryLean
