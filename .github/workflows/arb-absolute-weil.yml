name: Corrected Weil Absolute Spectrum

on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/arb_absolute_weil_eigenvalue.py'
      - '.github/workflows/arb-absolute-weil.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  absolute-spectrum:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GPP_ARB_PREC_BITS: '512'
      GPP_ARB_TOL: '1e-90'
      GPP_ABS_N: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Arb / NumPy
        run: python -m pip install 'python-flint==0.9.0' 'numpy>=2,<3'
      - name: Absolute spectrum rigorous lower and upper certificates
        run: python discovery/arb_absolute_weil_eigenvalue.py
