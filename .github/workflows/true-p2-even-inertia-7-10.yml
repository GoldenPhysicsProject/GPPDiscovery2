name: True First Prime Weil At Most One Negative Direction

on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/arb_actual_p2_even_comparison_inertia_7_10.py'
      - 'discovery/arb_true_p2_odd_hardy_remainder_7_10.py'
      - '.github/workflows/true-p2-even-inertia-7-10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FLINT interval arithmetic
        run: python -m pip install 'python-flint==0.9.0'
      - name: Certify finite even comparison inertia and positive infinite tail
        run: python discovery/arb_actual_p2_even_comparison_inertia_7_10.py
