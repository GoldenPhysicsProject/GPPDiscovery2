name: Four Prime Rational Endpoint 83-50 Arb Audit
on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/prime_four_atom_piecewise_arb_83_50.py'
      - '.github/workflows/four-prime-endpoint-83-50.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rational-supersolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Arb/FLINT
        run: python -m pip install 'python-flint==0.9.0'
      - name: Fully certify endpoint L=83/50 (all 2 3 4 5 prime atoms)
        run: python discovery/prime_four_atom_piecewise_arb_83_50.py
