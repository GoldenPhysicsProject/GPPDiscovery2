name: Codex generic Ds4 YM baseline
on:
  push:
    branches: ['codex/discovery-workbench']
    paths:
      - 'discovery/generalized_cuts/extract_generic_ds4_baseline.py'
      - 'discovery/generalized_cuts/generic_ds4_topology_projection_audit.py'
      - 'discovery/generalized_cuts/generic_tree_propagator_residue_audit.py'
      - 'discovery/generalized_cuts/presewing_residue_noninjectivity_audit.py'
      - 'discovery/generalized_cuts/generic_presewing_triple_cut_locus_audit.py'
      - 'discovery/generalized_cuts/generic_presewing_vector_scalar_residue_audit.py'
      - 'discovery/generalized_cuts/generic_presewing_laurent_factorization_audit.py'
      - 'discovery/generalized_cuts/generic_badger_chart_dimension_audit.py'
      - 'discovery/generalized_cuts/generic_full_chart_triple_cut_audit.py'
      - 'discovery/generalized_cuts/generic_full_chart_vector_scalar_tree_audit.py'
      - 'discovery/generalized_cuts/generic_full_chart_helicity_phase_audit.py'
      - 'discovery/generalized_cuts/massive_vector_generic_state_sum_symbolic.py'
      - 'discovery/generalized_cuts/massive_vector_mhv_state_sum_symbolic.py'
      - 'discovery/generalized_cuts/massive_vector_generic_ward_audit.py'
      - '.github/workflows/codex-generic-ym-baseline.yml'
  workflow_dispatch:

jobs:
  exact-symbolic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install sympy
      - name: Extract generic Ds4 baseline
        working-directory: discovery/generalized_cuts
        run: python extract_generic_ds4_baseline.py
      - name: Audit topology-projection obstruction
        working-directory: discovery/generalized_cuts
        run: python generic_ds4_topology_projection_audit.py
      - name: Audit propagator pole ancestry
        working-directory: discovery/generalized_cuts
        run: python generic_tree_propagator_residue_audit.py
      - name: Audit pre-sewing residue non-injectivity
        working-directory: discovery/generalized_cuts
        run: python presewing_residue_noninjectivity_audit.py
      - name: Audit generic pre-sewing triple-cut locus
        working-directory: discovery/generalized_cuts
        run: python generic_presewing_triple_cut_locus_audit.py
      - name: Audit generic vector-scalar triple-cut residues
        working-directory: discovery/generalized_cuts
        run: python generic_presewing_vector_scalar_residue_audit.py
      - name: Audit pre-sewing Laurent factorization
        working-directory: discovery/generalized_cuts
        run: python generic_presewing_laurent_factorization_audit.py
      - name: Audit generic-to-Badger chart dimension
        working-directory: discovery/generalized_cuts
        run: python generic_badger_chart_dimension_audit.py
      - name: Audit full two-coordinate triple-cut chart
        working-directory: discovery/generalized_cuts
        run: python generic_full_chart_triple_cut_audit.py
      - name: Audit full-chart vector/scalar tree lift
        working-directory: discovery/generalized_cuts
        run: python generic_full_chart_vector_scalar_tree_audit.py
      - name: Audit full triple-cut helicity phase covariance
        working-directory: discovery/generalized_cuts
        run: python generic_full_chart_helicity_phase_audit.py
      - name: Audit generic external Ward identities
        working-directory: discovery/generalized_cuts
        run: python massive_vector_generic_ward_audit.py
