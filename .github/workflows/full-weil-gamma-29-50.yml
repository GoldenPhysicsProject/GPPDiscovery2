name: Full Weil Strong Gamma Surplus 29 over 50

on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/arb_full_weil_hardy_gamma_29_50.py'
      - '.github/workflows/full-weil-gamma-29-50.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-function-completed-weil:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FLINT outward intervals
        run: python -m pip install 'python-flint==0.9.0'
      - name: Check infinite even/odd Hardy-Legendre Schur with sharp gamma surplus
        run: python discovery/arb_full_weil_hardy_gamma_29_50.py
