name: Full Completed Weil Legendre Hardy Curvature Arb

on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/full_weil_legendre_hardy_curvature_arb.py'
      - '.github/workflows/full-weil-curvature.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-all-function-full-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Arb/FLINT
        run: python -m pip install 'python-flint==0.9.0'
      - name: Certify completed Weil all-functions to L=209/500
        run: python discovery/full_weil_legendre_hardy_curvature_arb.py
