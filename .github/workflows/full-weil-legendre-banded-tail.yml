name: Full Completed Weil Infinite Legendre Banded Tail Arb

on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/full_weil_legendre_banded_tail_arb.py'
      - '.github/workflows/full-weil-legendre-banded-tail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-continuum-infinite-tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FLINT Arb
        run: python -m pip install 'python-flint==0.9.0'
      - name: Certify analytic infinite high tail plus finite Schur at L=12/25
        run: python discovery/full_weil_legendre_banded_tail_arb.py
