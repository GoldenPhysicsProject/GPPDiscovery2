name: Sharp First Prime Activation Regression

on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/first_prime_log_activation_sharpness.py'
      - '.github/workflows/first-prime-log-activation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2-first-activation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install high precision arithmetic
        run: python -m pip install 'mpmath==1.3.0'
      - name: Check two-sided prime activation and exact rectangle source
        run: python discovery/first_prime_log_activation_sharpness.py
