name: Raw Weil OS Hankel Infinite-Index NoGo

on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/arb_raw_weil_os_negative_index.py'
      - '.github/workflows/raw-weil-os-infinite-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scalar-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact/outward ball arithmetic
        run: python -m pip install 'python-flint==0.9.0'
      - name: Verify explicit interval and reflection-norm inequalities
        run: python discovery/arb_raw_weil_os_negative_index.py
