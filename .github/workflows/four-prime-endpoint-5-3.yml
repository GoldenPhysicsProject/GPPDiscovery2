name: Four Prime Rational Endpoint 5-3 Arb Audit
on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/prime_four_atom_piecewise_arb_5_3.py'
      - '.github/workflows/four-prime-endpoint-5-3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rational-supersolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Arb/FLINT
        run: python -m pip install 'python-flint==0.9.0'
      - name: Certify L=5/3 all-function prime Hardy Schur supersolution
        run: python discovery/prime_four_atom_piecewise_arb_5_3.py
