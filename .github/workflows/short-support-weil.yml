name: Short Support Weil Positivity

on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/arb_short_support_weil_certificate.py'
      - '.github/workflows/short-support-weil.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-test-support-theorem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install outward ball arithmetic
        run: python -m pip install 'python-flint==0.9.0'
      - name: Verify analytic support-interval constant
        run: python discovery/arb_short_support_weil_certificate.py
