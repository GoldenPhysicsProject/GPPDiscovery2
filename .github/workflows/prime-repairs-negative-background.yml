name: Prime Repairs Negative Background 3 over 4

on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/arb_prime_repairs_odd_background_3_4.py'
      - 'discovery/check_prime_repair_legendre_symbolic.py'
      - '.github/workflows/prime-repairs-negative-background.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-counter-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Arb ball arithmetic
        run: python -m pip install 'python-flint==0.9.0' 'sympy==1.13.3'
      - name: Independently derive exact Legendre autocorrelation
        run: python discovery/check_prime_repair_legendre_symbolic.py
      - name: Certify signed Q0 and true p2 repair
        run: python discovery/arb_prime_repairs_odd_background_3_4.py
