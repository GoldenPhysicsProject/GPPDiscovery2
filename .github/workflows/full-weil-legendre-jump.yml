name: Full Completed Weil Legendre Jump Arb Endpoint

on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/short_support_legendre_full_weil_arb.py'
      - '.github/workflows/full-weil-legendre-jump.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completed-all-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FLINT Arb 256-bit
        run: python -m pip install 'python-flint==0.9.0'
      - name: Certify completed form all-test through L=303/1000
        run: python discovery/short_support_legendre_full_weil_arb.py
