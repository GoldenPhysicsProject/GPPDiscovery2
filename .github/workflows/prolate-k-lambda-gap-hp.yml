name: HP prolate k-lambda gap scan

on:
  workflow_dispatch:
  push:
    branches: ['codex/discovery-workbench']
    paths:
      - 'discovery/rh/prolate_k_lambda_gap_scan_hp.py'
      - '.github/workflows/prolate-k-lambda-gap-hp.yml'

permissions:
  contents: write

jobs:
  point:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        c: [7, 11, 13, 17]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python discovery/rh/prolate_k_lambda_gap_scan_hp.py --c ${{ matrix.c }} --N 28 --T 300 --dps 100 --lmax 100 --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: prolate-hp-c${{ matrix.c }}
          path: result.json

  collect:
    needs: point
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/discovery-workbench
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          python - <<'PY'
          import glob, json, os
          rows=[]
          for fn in glob.glob("artifacts/**/result.json", recursive=True):
              rows.append(json.load(open(fn)))
          rows.sort(key=lambda r:r["c"])
          os.makedirs("research", exist_ok=True)
          out="research/2026-09-28_prolate_k_lambda_gap_scan_hp_results.jsonl"
          with open(out,"w") as f:
              for r in rows:
                  f.write(json.dumps(r)+"\n")
          md=[
              "# High-precision CCM prolate k_lambda gap scan",
              "",
              "Legendre-Galerkin at arbitrary precision plus exact finite Mellin/Dirichlet-polynomial projection. No zeta-zero data.",
              "",
              "| c | overlap | 1-overlap^2 | eps/gap | residual/dist2 | odd fraction | lam1 | gap |",
              "|---:|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for r in rows:
              def sf(x):
                  try: return f"{float(x):.6e}"
                  except: return str(x)
              md.append(
                  f"| {r['c']} | {sf(r['overlap'])} | {sf(r['one_minus_overlap_sq'])} | "
                  f"{sf(r['rayleigh_excess_over_gap'])} | {sf(r['residual_over_dist2'])} | "
                  f"{sf(r['fourier_odd_fraction'])} | {sf(r['lam1'])} | {sf(r['gap'])} |"
              )
          open("research/2026-09-28_prolate_k_lambda_gap_scan_hp_results.md","w").write("\n".join(md)+"\n")
          print("\n".join(md))
          PY
      - name: Commit results
        run: |
          git config user.name gpp-bot
          git config user.email dtoupin@goldenphysics.org
          git add research/2026-09-28_prolate_k_lambda_gap_scan_hp_results.*
          git commit -m "Discovery: record high-precision prolate k_lambda gap scan" || echo nochange
          git push origin HEAD:codex/discovery-workbench
