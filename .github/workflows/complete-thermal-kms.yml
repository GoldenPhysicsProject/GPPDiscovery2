name: Completed Weil All-Scale BC KMS and Gamma Thermal Identity Audit

on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/complete_thermal_kms_identity_audit.py'
      - '.github/workflows/complete-thermal-kms.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-completed-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install 60-dps integration diagnostics
        run: python -m pip install 'mpmath==1.3.0'
      - name: Check original completed gamma pole prime contact against global KMS-thermal decomposition
        run: python discovery/complete_thermal_kms_identity_audit.py
