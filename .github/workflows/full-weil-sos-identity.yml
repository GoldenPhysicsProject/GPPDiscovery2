name: Completed Weil Exact SOS Identity Regression

on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/semilocal_full_sos_identity_check.py'
      - '.github/workflows/full-weil-sos-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-versus-sos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical quadrature libraries
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1'
      - name: Independently compare corrected exact Weil form to full SOS
        run: python discovery/semilocal_full_sos_identity_check.py
