name: Full Weil Quartic Hardy Legendre Arb

on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/full_weil_legendre_hardy_quartic_arb.py'
      - '.github/workflows/full-weil-quartic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completed-quartic-all-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Arb/FLINT
        run: python -m pip install 'python-flint==0.9.0'
      - name: Certify completed Weil full form to L=43/100
        run: python discovery/full_weil_legendre_hardy_quartic_arb.py
