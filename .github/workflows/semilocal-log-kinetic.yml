name: Semilocal Log Kinetic Check

on:
  push:
    branches: [codex/discovery-workbench]
    paths:
      - 'discovery/semilocal_log_kinetic_check.py'
      - '.github/workflows/semilocal-log-kinetic.yml'
  workflow_dispatch:

jobs:
  analytic-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test dependency
        run: python -m pip install 'mpmath==1.3.0'
      - name: Test signed Weil decomposition
        run: python discovery/semilocal_log_kinetic_check.py
